name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit web production dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit API dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r services/api/requirements.txt -r services/api/requirements-otel.txt -r services/analysis/requirements-otel.txt

  web-build:
    name: Web Type Check and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      - name: Type check
        run: npm run type-check
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
      - name: Report view-model tests
        run: npm test
        working-directory: apps/web
      - name: Build
        working-directory: apps/web
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-runtime-secret
          PRIVATE_BETA_MODE: "true"
          PRIVATE_BETA_EMAIL: ci@example.invalid
        run: npm run build

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build
        working-directory: apps/web
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-runtime-secret
          PRIVATE_BETA_MODE: "true"
          PRIVATE_BETA_EMAIL: ci@example.invalid
          OTEL_ENABLED: "false"
        run: npm run build
      - name: Run e2e
        working-directory: apps/web
        env:
          CI: "true"
          AUTH_SECRET: ci-build-placeholder-not-a-runtime-secret
          PRIVATE_BETA_MODE: "true"
          PRIVATE_BETA_EMAIL: ci@example.invalid
          OTEL_ENABLED: "false"
        run: npm run test:e2e

  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test
        working-directory: services/api
        run: |
          pip install -r requirements.txt pytest
          pytest tests/ -v --tb=short

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run ruff lint
        run: |
          cd packages/scoring
          ruff check .
      
      - name: Run ruff format check
        run: |
          cd packages/scoring
          ruff format --check .
      
      - name: Run mypy (strict)
        run: |
          cd packages/scoring
          mypy --strict scoring/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run pytest
        run: |
          cd packages/scoring
          pytest -v --tb=short

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libglib2.0-0 \
            libgomp1 \
            libgl1 \
            libsm6 \
            libxext6 \
            libxrender1 \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-por \
            poppler-utils
      
      - name: Install Python dependencies
        run: |
          cd services/analysis
          pip install -r requirements.txt
      
      - name: Run worker tests
        run: |
          cd services/analysis
          pytest -v --tb=short

      - name: Golden fixtures
        run: python scripts/process_local.py --golden

  validate-config:
    name: Validate Scoring Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
      
      - name: Validate scoring config against schema
        run: |
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          import jsonschema
          
          schema_path = Path("packages/scoring-config/scoring-config.schema.json")
          with open(schema_path) as f:
              schema = json.load(f)
          for version in ("1.0.0", "1.1.0"):
              config_path = Path(f"packages/scoring-config/v{version}/scoring.yaml")
              with open(config_path) as f:
                  config = yaml.safe_load(f)
              try:
                  jsonschema.validate(instance=config, schema=schema)
                  print(f"✅ Scoring config v{version} is valid against schema")
              except jsonschema.ValidationError as e:
                  print(f"❌ Validation error in v{version}: {str(e.message)}")
                  raise
          EOF

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install "datamodel-code-generator[http]==0.83.0"
      
      - name: Check generated types are up to date
        run: |
          bash scripts/check_generated.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate ephemeral CI configuration
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "MINIO_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "MINIO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "PRIVATE_BETA_MODE=true"
            echo "PRIVATE_BETA_EMAIL=ci@example.invalid"
            echo "STAGECOACH_ARTIFACT_KEY=$(openssl rand -hex 32)"
          } > .env
      
      - name: Pre-pull images with retries
        run: |
          set -e
          
          IMAGES=(
            "mirror.gcr.io/library/postgres:16-alpine"
            "mirror.gcr.io/library/redis:7-alpine"
            "mirror.gcr.io/library/python:3.11-slim"
            "mirror.gcr.io/library/python:3.11-slim-bookworm"
            "ghcr.io/axllent/mailpit:latest"
          )
          
          for IMAGE in "${IMAGES[@]}"; do
            echo "Pulling $IMAGE..."
            ATTEMPT=0
            MAX_ATTEMPTS=3
            
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if docker pull "$IMAGE"; then
                echo "✅ Successfully pulled $IMAGE"
                break
              fi
              
              ATTEMPT=$((ATTEMPT + 1))
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                WAIT=$((4 * 2**ATTEMPT))
                echo "⚠️  Pull failed, retrying in ${WAIT}s (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
                sleep $WAIT
              else
                echo "❌ Failed to pull $IMAGE after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            done
          done
          
          echo "✅ All images pre-pulled successfully"
      
      - name: Start services (core + worker)
        run: docker compose --profile workers up -d --wait
        timeout-minutes: 8
      
      - name: Run migrations
        run: |
          docker compose exec -T api bash -c "cd /app && alembic upgrade head"
      
      - name: Run database migrations
        run: |
          echo "=== Running Database Migrations ==="
          docker compose exec -T api alembic upgrade head
          echo "✅ Migrations complete"
      
      - name: Seed scoring config
        run: |
          echo "=== Seeding Scoring Config ==="
          docker compose exec -T api python -m app.seed.scoring_config
          echo "✅ Scoring config seeded"
      
      - name: Wait for API health
        run: |
          echo "=== Checking API Health ==="
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo ""
              echo "✅ API is healthy"
              break
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 2
          done
      
      - name: Wait for worker health
        run: |
          echo "=== Checking Worker Health ==="
          for i in {1..30}; do
            RESULT=$(docker compose exec -T worker celery -A worker.app inspect ping 2>&1 || true)
            if echo "$RESULT" | grep -q "pong"; then
              echo "✅ Worker is healthy"
              break
            fi
            echo "Attempt $i/30: waiting for worker..."
            sleep 2
          done
      
      - name: Generate test fixture
        run: |
          echo "=== Generating Test Fixture ==="
          docker compose exec -T worker python tests/generate_fixture.py
          echo "✅ Fixture generated"
      
      - name: Test ingest and ASR pipeline
        run: |
          echo "=== Testing Ingest + ASR Stages ==="
          docker compose exec -T worker python << 'EOF'
          import tempfile
          import subprocess
          from pathlib import Path
          from worker import app
          
          # Persist under MEDIA_ROOT so GET /report can return the same artifacts.
          with tempfile.TemporaryDirectory() as tmpdir:
              fixture_path = Path(tmpdir) / "test.mp3"
              
              # Generate test audio with speech-like modulation
              cmd = [
                  "ffmpeg",
                  "-f", "lavfi",
                  "-i", "sine=frequency=440:duration=3",
                  "-ar", "16000",
                  "-ac", "1",
                  "-y",
                  str(fixture_path),
              ]
              subprocess.run(cmd, check=True, capture_output=True)
              
              print(f"Generated test fixture: {fixture_path}")
              
              # Test health check (explicitly route to cpu queue)
              result = app.send_task("tasks.health_check", queue="cpu")
              health = result.get(timeout=10)
              print(f"Health check: {health}")
              assert health["status"] == "healthy"
              
              # Test ingest (explicitly route to cpu queue)
              output_dir = Path("/data/stagecoach/smoke-fixture")
              output_dir.mkdir(parents=True, exist_ok=True)
              
              result = app.send_task(
                  "tasks.ingest",
                  args=[str(fixture_path), str(output_dir), "smoke-test"],
                  queue="cpu",
              )
              
              ingest_output = result.get(timeout=120)
              print(f"Ingest output keys: {list(ingest_output.keys())}")
              
              assert "media_info" in ingest_output
              assert "modality" in ingest_output
              assert "artifacts" in ingest_output
              assert ingest_output["modality"]["is_audio_only"]
              
              # Verify audio16k.wav artifact
              audio16k_path = Path(ingest_output["artifacts"]["audio16k"])
              assert audio16k_path.exists(), f"audio16k.wav not found at {audio16k_path}"
              print(f"✅ Ingest passed: {audio16k_path}")
              
              # Test ASR with ingest result (chained)
              result = app.send_task(
                  "tasks.asr",
                  args=[ingest_output, str(output_dir), "smoke-test", None, None, None],
                  queue="cpu",
              )
              
              asr_output = result.get(timeout=180)
              print(f"ASR output keys: {list(asr_output.keys())}")
              
              assert "language" in asr_output
              assert "segments" in asr_output
              assert "word_count" in asr_output
              assert "transcript_path" in asr_output
              
              # Verify transcript.json artifact
              transcript_path = Path(asr_output["transcript_path"])
              assert transcript_path.exists(), f"transcript.json not found at {transcript_path}"
              print(f"✅ ASR passed: {transcript_path}")
              
              # Verify transcript content
              import json
              with open(transcript_path) as f:
                  transcript_data = json.load(f)
              
              print(f"Transcript: {len(transcript_data['segments'])} segments, {transcript_data['word_count']} words")
              print(f"Language: {transcript_data['language']} (confidence: {transcript_data['language_probability']:.2f})")
              
              # Audio features + persisted metrics (issues #24, #25)
              result = app.send_task(
                  "tasks.audio_features",
                  args=[asr_output, str(output_dir), "smoke-test", None],
                  queue="cpu",
              )
              features_output = result.get(timeout=180)
              print(f"audio_features keys: {list(features_output.keys())}")
              artifacts = features_output.get("artifacts") or {}
              for name in ("prosody", "pauses", "syllables", "audio_metrics"):
                  path = Path(artifacts[name])
                  assert path.exists(), f"{name} missing at {path}"
              metrics_path = Path(output_dir) / "metrics.json"
              if "metrics" in artifacts:
                  metrics_path = Path(artifacts["metrics"])
              assert metrics_path.exists(), f"metrics.json not found at {metrics_path}"
              with open(metrics_path) as f:
                  metrics_data = json.load(f)
              assert "pp_wpm" in metrics_data["metrics"]
              assert metrics_data["metrics"]["pp_wpm"]["unit"] == "words_per_minute"
              assert metrics_data["metrics"]["vv_pvq_median"]["unit"] == "ratio"
              print(f"✅ audio_features + metrics persisted: {metrics_path}")

              # Fusion + report (issue #30)
              fusion = app.send_task(
                  "tasks.fusion_scoring",
                  kwargs={
                      "output_dir": str(output_dir),
                      "session_id": "00000000-0000-4000-8000-000000000099",
                      "context_type": "keynote",
                      "language": "en",
                  },
                  queue="cpu",
              )
              fusion_output = fusion.get(timeout=60)
              analysis_path = output_dir / "analysis_result.json"
              assert analysis_path.exists(), f"analysis_result.json missing at {analysis_path}"
              assert fusion_output["provenance"]["scoring_config_version"] == "1.1.0"
              video_na = [
                  c for c in fusion_output["categories"]
                  if c["id"] in ("visual_aids", "gestures_body", "eye_contact", "facial_affect")
              ]
              assert all(c["applicable"] is False and c["score"] is None for c in video_na)
              report_task = app.send_task(
                  "tasks.report",
                  kwargs={
                      "fusion_result": fusion_output,
                      "output_dir": str(output_dir),
                      "session_id": "00000000-0000-4000-8000-000000000099",
                  },
                  queue="cpu",
              )
              report_output = report_task.get(timeout=60)
              report_path = Path(report_output["report_path"])
              assert report_path.exists(), f"report.json missing at {report_path}"
              report_data = json.loads(report_path.read_text())
              assert "insights" in report_data
              assert report_data["insights"]["summary"]
              print(f"✅ fusion_scoring + report produced: {report_path}")
              
          print("✅ Ingest + ASR + audio_features + metrics + fusion + report pipeline test passed")
          EOF
      
      - name: Verify Phase 0 Acceptance Criteria
        run: |
          echo "=== Phase 0 Smoke Test ==="
          echo ""
          
          echo "1. Core Services:"
          docker compose ps
          echo ""
          
          echo "2. Worker Service:"
          docker compose ps worker
          echo ""
          
          echo "3. API Health:"
          curl -f -s http://localhost:8000/health | python3 -m json.tool
          echo ""
          
          echo "4. Database Tables (baseline + result + audit tables):"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -c "\dt" | grep -E "table|users|consents|sessions|media_assets|analysis_jobs|job_steps|scoring_configs|transcripts|metric_values|category_scores|overall_scores|evidence_items|insights|audit_log|deletion_requests|model_registry"
          echo ""
          
          echo "5. Seeded Config:"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -c "SELECT version, created_at FROM scoring_configs LIMIT 1;"
          echo ""
          echo "5b. model_registry (issue #38):"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -c "SELECT model_name, license FROM model_registry ORDER BY model_name;"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -tAc "SELECT COUNT(*) FROM model_registry WHERE license = 'Apache-2.0'" | grep -qx '3'
          echo ""
          
          echo "6. Redis:"
          docker compose exec -T redis redis-cli ping
          echo ""
          
          echo "7. POST /api/v1/sessions with JWT:"
          TEST_JWT=$(docker compose exec -T api python -c "import os; from datetime import datetime, timedelta, timezone; import jwt; now=datetime.now(timezone.utc); print(jwt.encode({'email':'test@example.com','sub':'test-user','iss':'stagecoach-web','aud':'stagecoach-api','iat':now,'nbf':now-timedelta(seconds=5),'exp':now+timedelta(minutes=5)}, os.environ['AUTH_SECRET'], algorithm='HS256'))")

          echo ""
          echo "7a. GET/POST /api/v1/me/consents (issue #37):"
          CONSENT_GET=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            "http://localhost:8000/api/v1/me/consents?locale=en")
          CONSENT_STATUS=$(echo "$CONSENT_GET" | grep "HTTP_STATUS:" | cut -d: -f2)
          CONSENT_BODY=$(echo "$CONSENT_GET" | sed '/HTTP_STATUS:/d')
          echo "   GET HTTP Status: $CONSENT_STATUS"
          echo "$CONSENT_BODY" | python3 -c "
          import sys, json
          d=json.load(sys.stdin)
          assert d.get('policy_version') and len(d['policy_version'])==64
          by={c['purpose']: c for c in d['consents']}
          for p in ('video_analysis','expression_analysis','keep_detailed_tracking'):
              assert by[p]['granted'] is False, p
              assert by[p]['title'] and by[p]['what'] and by[p]['why'] and by[p]['limits'] and by[p]['never']
          never=' '.join(c['never'].lower() for c in d['consents'])
          assert 'emotion inference' in never
          assert 'inner states' in never
          print('policy_version', d['policy_version'][:12], 'defaults off')
          "
          if [ "$CONSENT_STATUS" != "200" ]; then
            echo "   ❌ Expected 200 from GET /me/consents, got $CONSENT_STATUS"
            echo "$CONSENT_BODY"
            exit 1
          fi
          CONSENT_POST=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            -H "Content-Type: application/json" \
            -d '{"purpose":"video_analysis","granted":true}' \
            "http://localhost:8000/api/v1/me/consents?locale=en")
          POST_STATUS=$(echo "$CONSENT_POST" | grep "HTTP_STATUS:" | cut -d: -f2)
          POST_BODY=$(echo "$CONSENT_POST" | sed '/HTTP_STATUS:/d')
          echo "   POST grant HTTP Status: $POST_STATUS"
          echo "$POST_BODY" | python3 -c "
          import sys, json
          d=json.load(sys.stdin)
          by={c['purpose']: c for c in d['consents']}
          assert by['video_analysis']['granted'] is True
          assert by['expression_analysis']['granted'] is False
          print('granted video_analysis; expression still off')
          "
          if [ "$POST_STATUS" != "201" ]; then
            echo "   ❌ Expected 201 from POST /me/consents, got $POST_STATUS"
            echo "$POST_BODY"
            exit 1
          fi
          CONSENT_REVOKE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            -H "Content-Type: application/json" \
            -d '{"purpose":"video_analysis","granted":false}' \
            "http://localhost:8000/api/v1/me/consents")
          REVOKE_STATUS=$(echo "$CONSENT_REVOKE" | grep "HTTP_STATUS:" | cut -d: -f2)
          REVOKE_BODY=$(echo "$CONSENT_REVOKE" | sed '/HTTP_STATUS:/d')
          echo "$REVOKE_BODY" | python3 -c "
          import sys, json
          d=json.load(sys.stdin)
          by={c['purpose']: c for c in d['consents']}
          assert by['video_analysis']['granted'] is False
          assert by['video_analysis']['revoked_at']
          print('revoked video_analysis')
          "
          if [ "$REVOKE_STATUS" != "201" ]; then
            echo "   ❌ Expected 201 from revoke POST, got $REVOKE_STATUS"
            echo "$REVOKE_BODY"
            exit 1
          fi
          BAD=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            -H "Content-Type: application/json" \
            -d '{"purpose":"emotion_inference","granted":true}' \
            "http://localhost:8000/api/v1/me/consents")
          if [ "$BAD" != "422" ]; then
            echo "   ❌ Expected 422 for unknown purpose, got $BAD"
            exit 1
          fi
          echo "   ✅ Consents default off, grant/revoke append-only, unknown purpose rejected"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            -H "Content-Type: application/json" \
            -d '{"title":"Phase 0 Test Session","context_type":"keynote","language":"en","camera_setup":"to_camera"}' \
            http://localhost:8000/api/v1/sessions)
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "   Response:"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          echo "   HTTP Status: $STATUS"
          
          if [ "$STATUS" = "201" ]; then
            if echo "$BODY" | grep -q "\"url\""; then
              echo "   ✅ Session created with upload URL"
            else
              echo "   ❌ Missing tus_url"
              exit 1
            fi
          else
            echo "   ❌ Expected 201, got $STATUS"
            exit 1
          fi

          SESSION_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo ""
          echo "8. GET /api/v1/sessions/{id}/report (issue #31):"
          docker compose exec -T -e SESSION_ID="$SESSION_ID" api python << 'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from app.database import SessionLocal
          from app.models.analysis_job import AnalysisJob
          from app.models.job_step import JobStep
          from app.models.session import Session as SessionModel

          session_id = os.environ["SESSION_ID"]
          report = Path("/data/stagecoach/smoke-fixture/report.json")
          analysis = Path("/data/stagecoach/smoke-fixture/analysis_result.json")
          transcript = Path("/data/stagecoach/smoke-fixture/transcript.json")
          if not report.is_file():
              raise SystemExit(f"report.json missing at {report}")
          db = SessionLocal()
          try:
              session = db.query(SessionModel).filter(SessionModel.id == session_id).one()
              job = AnalysisJob(
                  session_id=session.id,
                  scoring_config_version="1.0.0",
                  pipeline_version="1.0.0",
                  status="partial",
              )
              db.add(job)
              db.flush()
              db.add(
                  JobStep(
                      job_id=job.id,
                      stage="report",
                      stage_version="1.0.0",
                      status="succeeded",
                      output_uris={
                          key: value
                          for key, value in {
                              "report": str(report),
                              "analysis_result": str(analysis) if analysis.is_file() else str(report),
                              "transcript": str(transcript) if transcript.is_file() else "",
                          }.items()
                          if value
                      },
                      started_at=datetime.utcnow(),
                      finished_at=datetime.utcnow(),
                  )
              )
              db.commit()
              print(f"linked job {job.id} to session {session_id}")
          finally:
              db.close()
          PY

          REPORT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            http://localhost:8000/api/v1/sessions/$SESSION_ID/report)
          REPORT_STATUS=$(echo "$REPORT_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          REPORT_BODY=$(echo "$REPORT_RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "   HTTP Status: $REPORT_STATUS"
          echo "$REPORT_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('summary:', (d.get('insights') or {}).get('summary','')[:160]); assert d.get('insights',{}).get('summary'); assert d.get('provenance',{}).get('scoring_config_version')=='1.1.0'; na=[p for p in d.get('pillars') or [] if p.get('score') is None]; scored=[p for p in d.get('pillars') or [] if p.get('score') is not None]; assert all(p.get('score') is None for p in na); assert 0 not in [p.get('score') for p in na]; print('unavailable pillars:', [p.get('id') for p in na], 'scored:', [(p.get('id'), p.get('score')) for p in scored])"
          if [ "$REPORT_STATUS" != "200" ]; then
            echo "   ❌ Expected 200 from GET /report, got $REPORT_STATUS"
            echo "$REPORT_BODY"
            exit 1
          fi
          echo "   ✅ GET /report returned the synthetic fixture report.json"

          echo ""
          echo "9. DELETE /api/v1/sessions/{id} (issue #34 — leftover files and rows gone):"
          docker compose exec -T -e SESSION_ID="$SESSION_ID" api python << 'PY'
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from app.database import SessionLocal
          from app.models.analysis_job import AnalysisJob
          from app.models.category_score import CategoryScore
          from app.models.evidence_item import EvidenceItem
          from app.models.insight import Insight
          from app.models.media_asset import MediaAsset
          from app.models.metric_value import MetricValue
          from app.models.overall_score import OverallScore
          from app.models.session import Session as SessionModel
          from app.models.transcript import Transcript

          session_id = os.environ["SESSION_ID"]
          media_root = Path("/data/stagecoach")
          session_dir = media_root / session_id
          (session_dir / "upload").mkdir(parents=True, exist_ok=True)
          (session_dir / "derived").mkdir(parents=True, exist_ok=True)
          (session_dir / "upload" / "original.bin").write_bytes(b"not-a-recording")
          (session_dir / "derived" / "report.json").write_text("{}")
          (session_dir / "derived" / "transcript.json").write_text('{"segments":[]}')
          other = media_root / "keep-other"
          other.mkdir(parents=True, exist_ok=True)
          (other / "keep.bin").write_bytes(b"keep")
          fixture = media_root / "smoke-fixture" / "report.json"
          if not fixture.is_file():
              raise SystemExit("smoke-fixture/report.json missing; refusing to plant delete fixtures")
          db = SessionLocal()
          try:
              session = db.query(SessionModel).filter(SessionModel.id == session_id).one()
              job = (
                  db.query(AnalysisJob)
                  .filter(AnalysisJob.session_id == session.id)
                  .order_by(AnalysisJob.created_at.desc())
                  .one()
              )
              db.add(
                  MediaAsset(
                      session_id=session.id,
                      kind="original",
                      storage_uri=str(session_dir / "upload" / "original.bin"),
                      bytes=15,
                      sha256="0" * 64,
                      retention_until=datetime.utcnow() + timedelta(days=30),
                  )
              )
              db.add(
                  Transcript(
                      job_id=job.id,
                      language="en",
                      asr_model="smoke",
                      words_uri=str(session_dir / "derived" / "transcript.json"),
                      mean_word_prob=0.9,
                  )
              )
              db.add(
                  MetricValue(
                      job_id=job.id,
                      metric_id="pp_wpm",
                      raw_value=120.0,
                      unit="words_per_minute",
                      score=80.0,
                      confidence=0.5,
                      source_key="heuristic",
                  )
              )
              db.add(
                  CategoryScore(
                      job_id=job.id,
                      category_id="pace",
                      score=None,
                      applicable=False,
                      na_reason="smoke",
                  )
              )
              db.add(
                  OverallScore(
                      job_id=job.id,
                      overall=None,
                      coverage=0.0,
                      context_type="keynote",
                      config_version="1.0.0",
                  )
              )
              db.add(
                  EvidenceItem(
                      job_id=job.id,
                      category_id="pace",
                      metric_id="pp_wpm",
                      t_start=0.0,
                      t_end=1.0,
                      modality="audio",
                      kind="observation",
                      quote=None,
                      confidence=0.4,
                  )
              )
              db.add(
                  Insight(
                      job_id=job.id,
                      type="opportunity",
                      rank=1,
                      category_id="pace",
                      title="placeholder",
                      body_md=None,
                  )
              )
              db.commit()
              Path("/tmp/stagecoach-delete-job-id").write_text(str(job.id))
              print(f"planted 3 files under {session_dir} and result rows for job {job.id}")
          finally:
              db.close()
          PY

          DELETE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $TEST_JWT" \
            http://localhost:8000/api/v1/sessions/$SESSION_ID)
          echo "   DELETE HTTP Status: $DELETE_RESPONSE"
          if [ "$DELETE_RESPONSE" != "204" ]; then
            echo "   ❌ Expected 204 from DELETE /sessions/{id}, got $DELETE_RESPONSE"
            exit 1
          fi

          GET_AFTER=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            http://localhost:8000/api/v1/sessions/$SESSION_ID)
          echo "   GET after delete HTTP Status: $GET_AFTER"
          if [ "$GET_AFTER" != "404" ]; then
            echo "   ❌ Expected 404 after delete, got $GET_AFTER"
            exit 1
          fi

          docker compose exec -T -e SESSION_ID="$SESSION_ID" api python << 'PY'
          import json
          import os
          from pathlib import Path
          from uuid import UUID
          from app.database import SessionLocal
          from app.deletion import CONTENT_KEYS
          from app.models.analysis_job import AnalysisJob
          from app.models.audit_log import AuditLog
          from app.models.category_score import CategoryScore
          from app.models.deletion_request import DeletionRequest
          from app.models.evidence_item import EvidenceItem
          from app.models.insight import Insight
          from app.models.media_asset import MediaAsset
          from app.models.metric_value import MetricValue
          from app.models.overall_score import OverallScore
          from app.models.session import Session as SessionModel
          from app.models.transcript import Transcript

          session_id = os.environ["SESSION_ID"]
          media_root = Path("/data/stagecoach")
          session_dir = media_root / session_id
          leftover = list(session_dir.rglob("*")) if session_dir.exists() else []
          if leftover:
              raise SystemExit(f"session files remain: {leftover}")
          keep = media_root / "keep-other" / "keep.bin"
          fixture = media_root / "smoke-fixture" / "report.json"
          if not keep.is_file():
              raise SystemExit("sibling keep-other/keep.bin was removed")
          if not fixture.is_file():
              raise SystemExit("smoke-fixture/report.json was removed")

          db = SessionLocal()
          try:
              job_id = UUID(Path("/tmp/stagecoach-delete-job-id").read_text().strip())
              sessions = db.query(SessionModel).filter(SessionModel.id == session_id).count()
              assets = db.query(MediaAsset).filter(MediaAsset.session_id == session_id).count()
              jobs = db.query(AnalysisJob).filter(AnalysisJob.session_id == session_id).count()
              leftovers = {
                  "sessions": sessions,
                  "media_assets": assets,
                  "analysis_jobs": jobs,
                  "transcripts": db.query(Transcript).filter(Transcript.job_id == job_id).count(),
                  "metric_values": db.query(MetricValue).filter(MetricValue.job_id == job_id).count(),
                  "category_scores": db.query(CategoryScore).filter(CategoryScore.job_id == job_id).count(),
                  "overall_scores": db.query(OverallScore).filter(OverallScore.job_id == job_id).count(),
                  "evidence_items": db.query(EvidenceItem).filter(EvidenceItem.job_id == job_id).count(),
                  "insights": db.query(Insight).filter(Insight.job_id == job_id).count(),
              }
              if any(leftovers.values()):
                  raise SystemExit(f"db leftovers {leftovers}")
              audit = (
                  db.query(AuditLog)
                  .filter(AuditLog.action == "session.delete", AuditLog.target_id == session_id)
                  .one()
              )
              details = audit.details or {}
              payload = json.dumps(details)
              for key in CONTENT_KEYS:
                  if key in details:
                      raise SystemExit(f"audit details contain content key {key}")
                  if f'"{key}"' in payload:
                      raise SystemExit(f"audit details JSON mentions content key {key}")
              if "object_count" not in details:
                  raise SystemExit("audit details missing object_count")
              if details["object_count"] < 3:
                  raise SystemExit(f"expected at least 3 deleted objects, got {details['object_count']}")
              if details.get("prefixes") != ["local", "object_store"]:
                  raise SystemExit(f"unexpected prefixes: {details.get('prefixes')}")
              proof = (
                  db.query(DeletionRequest)
                  .filter(DeletionRequest.scope == "session")
                  .order_by(DeletionRequest.requested_at.desc())
                  .first()
              )
              if proof is None or proof.completed_at is None:
                  raise SystemExit("deletion_requests row missing or incomplete")
              verification = proof.verification or {}
              if verification.get("local_remaining") != 0:
                  raise SystemExit(f"local_remaining={verification.get('local_remaining')}")
              if verification.get("db_remaining") != 0:
                  raise SystemExit(f"db_remaining={verification.get('db_remaining')}")
              if verification.get("search_index") != "not_deployed":
                  raise SystemExit("search_index should be not_deployed")
              left = verification.get("db_left") or {}
              if any(left.values()):
                  raise SystemExit(f"db_left not empty: {left}")
              print(
                  f"audit object_count={details['object_count']} "
                  f"db_rows={details.get('db_rows')} verification={verification}"
              )
          finally:
              db.close()
          PY
          echo "   ✅ DELETE removed session files and DB rows; audit has counts only"

