name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run ruff lint
        run: |
          cd packages/scoring
          ruff check .
      
      - name: Run ruff format check
        run: |
          cd packages/scoring
          ruff format --check .
      
      - name: Run mypy (strict)
        run: |
          cd packages/scoring
          mypy --strict scoring/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run pytest
        run: |
          cd packages/scoring
          pytest -v --tb=short

  validate-config:
    name: Validate Scoring Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
      
      - name: Validate scoring config against schema
        run: |
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          import jsonschema
          
          # Load config
          config_path = Path("packages/scoring-config/v1.0.0/scoring.yaml")
          with open(config_path) as f:
              config = yaml.safe_load(f)
          
          # Load schema
          schema_path = Path("packages/scoring-config/scoring-config.schema.json")
          with open(schema_path) as f:
              schema = json.load(f)
          
          # Validate
          try:
              jsonschema.validate(instance=config, schema=schema)
              print("✅ Scoring config is valid against schema")
          except jsonschema.ValidationError as e:
              print(f"❌ Validation error: {str(e.message)}")
              raise
          except Exception as e:
              print(f"❌ Error during validation: {str(e)}")
              raise
          EOF

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install "datamodel-code-generator[http]==0.25.1"
      
      - name: Check generated types are up to date
        run: |
          bash scripts/check_generated.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy env example
        run: cp .env.example .env
      
      - name: Start services (without MinIO profile)
        run: docker compose up -d --wait
        timeout-minutes: 5
      
      - name: Run migrations
        run: |
          docker compose exec -T api bash -c "cd /app && alembic upgrade head"
      
      - name: Seed scoring config
        run: |
          docker compose exec -T api python /scripts/seed_scoring_config.py
      
      - name: Wait for API health
        run: |
          echo "Waiting for API to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo ""
              echo "✅ API is healthy"
              break
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 2
          done
      
      - name: Show service status
        run: docker compose ps
      
      - name: Get API health response
        run: |
          echo "=== API Health Check ==="
          curl -s http://localhost:8000/health | python3 -m json.tool || echo "Failed to parse JSON"
      
      - name: MinIO status
        run: |
          echo "=== MinIO Status ==="
          echo "MinIO service uses --profile minio and is skipped in CI smoke test"
          echo "Reason: MinIO container images have auth/rate-limit issues in GitHub Actions"
          echo "Local usage: docker compose --profile minio up -d"
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      
      - name: Cleanup
        if: always()
        run: docker compose down -v
