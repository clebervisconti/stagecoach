          echo "  - partial_ready SSE + live report; vision failure → audio/text report with categories 12–14 N/A"
          echo "  - video-synced timeline lanes (sections/slides/fillers/pauses/rushing/monotone/gestures/audience-facing/smiles opt-in/CLT/QA); J/L Space arrows"
          echo "  - Body tab (heat, gesture space, events, sway, yaw, notes-down, expressivity opt-in, quality) and Slides tab (filmstrip + AI titles)"
          echo "  - PDF export via Playwright Chromium; GET /exports/{id}; no transcript unless include_transcript"
