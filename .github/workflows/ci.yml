name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run ruff lint
        run: |
          cd packages/scoring
          ruff check .
      
      - name: Run ruff format check
        run: |
          cd packages/scoring
          ruff format --check .
      
      - name: Run mypy (strict)
        run: |
          cd packages/scoring
          mypy --strict scoring/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run pytest
        run: |
          cd packages/scoring
          pytest -v --tb=short

  validate-config:
    name: Validate Scoring Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
      
      - name: Validate scoring config against schema
        run: |
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          import jsonschema
          
          # Load config
          config_path = Path("packages/scoring-config/v1.0.0/scoring.yaml")
          with open(config_path) as f:
              config = yaml.safe_load(f)
          
          # Load schema
          schema_path = Path("packages/scoring-config/scoring-config.schema.json")
          with open(schema_path) as f:
              schema = json.load(f)
          
          # Validate
          try:
              jsonschema.validate(instance=config, schema=schema)
              print("✅ Scoring config is valid against schema")
          except jsonschema.ValidationError as e:
              print(f"❌ Validation error: {str(e.message)}")
              raise
          except Exception as e:
              print(f"❌ Error during validation: {str(e)}")
              raise
          EOF

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install "datamodel-code-generator[http]==0.25.1"
      
      - name: Check generated types are up to date
        run: |
          bash scripts/check_generated.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy env example
        run: cp .env.example .env
      
      - name: Start services (without MinIO profile)
        run: docker compose up -d --wait
        timeout-minutes: 5
      
      - name: Run migrations
        run: |
          docker compose exec -T api bash -c "cd /app && alembic upgrade head"
      
      - name: Run database migrations
        run: |
          echo "=== Running Database Migrations ==="
          docker compose exec -T api alembic upgrade head
          echo "✅ Migrations complete"
      
      - name: Seed scoring config
        run: |
          echo "=== Seeding Scoring Config ==="
          docker compose exec -T api python -m app.seed.scoring_config
          echo "✅ Scoring config seeded"
      
      - name: Wait for API health
        run: |
          echo "=== Checking API Health ==="
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo ""
              echo "✅ API is healthy"
              break
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 2
          done
      
      - name: Verify Phase 0 Acceptance Criteria
        run: |
          echo "=== Phase 0 Smoke Test ==="
          echo ""
          
          echo "1. Core Services:"
          docker compose ps
          echo ""
          
          echo "2. Optional Services (tusd, worker):"
          echo "   These use --profile flags (minio, workers) and are declared but not running in CI:"
          docker compose config --services | grep -E "tusd|worker" || echo "   Services declared in compose file"
          echo ""
          
          echo "3. API Health:"
          curl -f -s http://localhost:8000/health | python3 -m json.tool
          echo ""
          
          echo "4. Database Tables (7 expected):"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -c "\dt" | grep -E "table|users|consents|sessions|media_assets|analysis_jobs|job_steps|scoring_configs"
          echo ""
          
          echo "5. Seeded Config:"
          docker compose exec -T postgres psql -U stagecoach -d stagecoach -c "SELECT version, created_at FROM scoring_configs LIMIT 1;"
          echo ""
          
          echo "6. Redis:"
          docker compose exec -T redis redis-cli ping
          echo ""
          
          echo "7. POST /api/v1/sessions with JWT:"
          TEST_JWT=$(python3 -c "
import jwt
from datetime import datetime, timedelta
token = jwt.encode({
    'email': 'test@example.com',
    'sub': 'test-user',
    'iat': datetime.utcnow(),
    'exp': datetime.utcnow() + timedelta(hours=1)
}, 'dev_secret_change_in_prod_use_openssl_rand_base64_32', algorithm='HS256')
print(token)
" 2>/dev/null)
          
          echo "   JWT (first 30 chars): ${TEST_JWT:0:30}..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $TEST_JWT" \
            -H "Content-Type: application/json" \
            -d '{"title":"Phase 0 Test Session","context_type":"keynote","language":"en","camera_setup":"to_camera"}' \
            http://localhost:8000/api/v1/sessions)
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "   Response:"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          echo "   HTTP Status: $STATUS"
          
          if [ "$STATUS" = "201" ]; then
            if echo "$BODY" | grep -q "tus_url"; then
              echo "   ✅ Session created with upload URL"
            else
              echo "   ❌ Missing tus_url"
              exit 1
            fi
          else
            echo "   ❌ Expected 201, got $STATUS"
            exit 1
          fi
          
          echo ""
          echo "✅ Phase 0 smoke test complete"
      
      - name: MinIO status
        run: |
          echo "=== MinIO Status ==="
          echo "MinIO service uses --profile minio and is skipped in CI smoke test"
          echo "Reason: MinIO container images have auth/rate-limit issues in GitHub Actions"
          echo "Local usage: docker compose --profile minio up -d"
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      
      - name: Cleanup
        if: always()
        run: docker compose down -v
