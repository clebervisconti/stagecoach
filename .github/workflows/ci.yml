          echo "  - Settings AI providers: local LM Studio / Qwen default; xAI optional; keys from env only"
          echo "  - GET /research/sources, /research + /research/myths, GET /config/scoring/{version} (read-only)"
          echo "  - OTel traces when OTLP endpoint set; GET /metrics; admin analysis-costs; error tracking none pending owner Sentry decision"
          echo "  - Report axe-core + keyboard-only player/timeline; captions; hatch patterns; reduced motion"
          echo "  - Phase 2 exit: stage/to-camera/screen N/A matrix; CPU fusion P50 stand-in; vision s/media-min on scripted frames"
          echo ""
          echo "Phase 3 additions:"
          echo "  - talk_plans / goals / objective_scores; POST/GET/PATCH /plans; POST regenerate enqueues prep_llm"
          echo "  - /prep form + POST /plans/{id}/clarify (prep_clarify_v1 ≤5 questions; skip → assumptions)"
          echo "  - GET /trends + /trends dashboard; incompatible sessions marked not comparable"
          echo "  - /prep/{id} editor + readiness (1–8, 16–17); Markdown/PDF export"
          echo "  - Resend transactional email (console default; no live Resend in CI)"
