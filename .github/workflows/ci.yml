name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run ruff lint
        run: |
          cd packages/scoring
          ruff check .
      
      - name: Run ruff format check
        run: |
          cd packages/scoring
          ruff format --check .
      
      - name: Run mypy (strict)
        run: |
          cd packages/scoring
          mypy --strict scoring/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd packages/scoring
          pip install -e ".[dev]"
      
      - name: Run pytest
        run: |
          cd packages/scoring
          pytest -v --tb=short

  validate-config:
    name: Validate Scoring Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
      
      - name: Validate scoring config against schema
        run: |
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          import jsonschema
          
          # Load config
          config_path = Path("packages/scoring-config/v1.0.0/scoring.yaml")
          with open(config_path) as f:
              config = yaml.safe_load(f)
          
          # Load schema
          schema_path = Path("packages/scoring-config/scoring-config.schema.json")
          with open(schema_path) as f:
              schema = json.load(f)
          
          # Validate
          try:
              jsonschema.validate(instance=config, schema=schema)
              print("✅ Scoring config is valid against schema")
          except jsonschema.ValidationError as e:
              print(f"❌ Validation error: {str(e.message)}")
              raise
          except Exception as e:
              print(f"❌ Error during validation: {str(e)}")
              raise
          EOF

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
