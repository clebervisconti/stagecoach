services:
  postgres:
    # Use mirror to avoid Docker Hub rate limits in CI
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: stagecoach-postgres
    environment:
      POSTGRES_DB: stagecoach
      POSTGRES_USER: stagecoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagecoach"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Use mirror to avoid Docker Hub rate limits in CI
    image: mirror.gcr.io/library/redis:7-alpine
    container_name: stagecoach-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # MinIO S3-compatible storage - pinned to specific release tag
    # Note: MinIO images have auth/rate-limit issues in GitHub Actions CI
    # CI smoke test skips this service via profile; works locally with --profile minio
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: stagecoach-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - minio  # Use --profile minio to start this service

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: stagecoach-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://stagecoach:${POSTGRES_PASSWORD}@postgres:5432/stagecoach
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      MEDIA_ROOT: /data/stagecoach
      LLM_PROVIDER: ${LLM_PROVIDER:-xai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:  # Optional dependency - uncomment when using --profile minio
      #   condition: service_healthy
    volumes:
      - ./services/api:/app
      - ./packages:/packages
      - ./docs:/docs:ro
      - ./scripts:/scripts
      - media_data:/data/stagecoach
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./services/analysis
      dockerfile: Dockerfile
    container_name: stagecoach-worker
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://stagecoach:${POSTGRES_PASSWORD}@postgres:5432/stagecoach
      MEDIA_ROOT: /data/stagecoach
      STAGECOACH_ARTIFACT_KEY: ${STAGECOACH_ARTIFACT_KEY:-}
      STAGECOACH_KEK: ${STAGECOACH_KEK:-}
      MEDIAPIPE_MODELS_DIR: /models
      LLM_PROVIDER: ${LLM_PROVIDER:-xai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analysis:/app
      - ./packages:/packages
      - worker_temp:/tmp/stagecoach
      - media_data:/data/stagecoach
    command: celery -A worker.app worker -Q cpu --loglevel=info --concurrency=2
    profiles:
      - workers  # Use --profile workers to start this service

  worker-beat:
    build:
      context: ./services/analysis
      dockerfile: Dockerfile
    container_name: stagecoach-worker-beat
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://stagecoach:${POSTGRES_PASSWORD}@postgres:5432/stagecoach
      MEDIA_ROOT: /data/stagecoach
      STAGECOACH_ARTIFACT_KEY: ${STAGECOACH_ARTIFACT_KEY:-}
      STAGECOACH_KEK: ${STAGECOACH_KEK:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analysis:/app
      - ./packages:/packages
      - media_data:/data/stagecoach
    command: celery -A worker.app beat --loglevel=info
    profiles:
      - workers

  mailpit:
    # Use ghcr.io mirror to avoid Docker Hub rate limits in CI
    image: ghcr.io/axllent/mailpit:latest
    container_name: stagecoach-mailpit
    ports:
      - "127.0.0.1:8025:8025"  # Web UI
      - "127.0.0.1:1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stagecoach-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_SERVER: smtp://mailpit:1025
      EMAIL_FROM: noreply@stagecoach.example.com
      INTERNAL_API_URL: http://api:8000
      PRIVATE_BETA_MODE: ${PRIVATE_BETA_MODE:-true}
      PRIVATE_BETA_EMAIL: ${PRIVATE_BETA_EMAIL:-local@example.invalid}
    depends_on:
      - api
      - mailpit
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    profiles:
      - web  # Optional in Phase 0 until fully functional

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_temp:
  media_data:
