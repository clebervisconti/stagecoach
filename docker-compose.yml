services:
  postgres:
    # Use mirror to avoid Docker Hub rate limits in CI
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: stagecoach-postgres
    environment:
      POSTGRES_DB: stagecoach
      POSTGRES_USER: stagecoach
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagecoach"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Use mirror to avoid Docker Hub rate limits in CI
    image: mirror.gcr.io/library/redis:7-alpine
    container_name: stagecoach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # MinIO S3-compatible storage - pinned to specific release tag
    # Note: MinIO images have auth/rate-limit issues in GitHub Actions CI
    # CI smoke test skips this service via profile; works locally with --profile minio
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: stagecoach-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - minio  # Use --profile minio to start this service

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: stagecoach-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://stagecoach:dev_password_change_in_prod@postgres:5432/stagecoach
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      AUTH_SECRET: dev_secret_change_in_prod_use_openssl_rand_base64_32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:  # Optional dependency - uncomment when using --profile minio
      #   condition: service_healthy
    volumes:
      - ./services/api:/app
      - ./packages:/packages
      - ./scripts:/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./services/analysis
      dockerfile: Dockerfile
    container_name: stagecoach-worker
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://stagecoach:dev_password_change_in_prod@postgres:5432/stagecoach
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analysis:/app
      - ./packages:/packages
      - worker_temp:/tmp/stagecoach
    command: celery -A worker.app worker -Q cpu --loglevel=info --concurrency=2
    profiles:
      - workers  # Use --profile workers to start this service

  mailpit:
    # Use ghcr.io mirror to avoid Docker Hub rate limits in CI
    image: ghcr.io/axllent/mailpit:latest
    container_name: stagecoach-mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stagecoach-web
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: dev_secret_change_in_prod_use_openssl_rand_base64_32
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_SERVER: smtp://mailpit:1025
      EMAIL_FROM: noreply@stagecoach.example.com
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api
      - mailpit
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    profiles:
      - web  # Optional in Phase 0 until fully functional

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_temp:
