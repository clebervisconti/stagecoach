# LION host overlay (OrbStack / Apple Silicon).
# Splunk already owns :8000; another service owns :5432.
#
# Compose merges sequence fields. `ports: []` does NOT clear the base list —
# use !reset / !override so only loopback 8870, 6380, and 9010 are published.
#
#   docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$ENV_FILE" \
#     -f docker-compose.yml -f infra/compose.lion.yaml \
#     ${LION_OVERRIDE:+-f "$LION_OVERRIDE"} \
#     --profile web --profile minio --profile workers \
#     up -d postgres redis minio api worker web mailpit
#
# Or: make lion-build && make lion-up
#     COMPOSE_PROJECT_NAME / ENV_FILE / LION_OVERRIDE are make variables.
#     worker-beat is not started (profile lion-beat).
#
# Never bind host 8000 or 5432.

services:
  postgres:
    ports: !reset []

  api:
    ports: !reset []
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      STAGECOACH_PUBLIC_URL: ${STAGECOACH_PUBLIC_URL:-http://127.0.0.1:8870}

  worker:
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SILERO_VAD_DIR: /models/silero-vad
      FASTER_WHISPER_DIR: /models/faster-whisper
      NLTK_DATA: /models/nltk_data
      TORCH_HOME: /models/torch
      ALIGNMENT_PT_DIR: /models/alignment/wav2vec2-large-xlsr-53-portuguese

  # Beat is not used on the LION lab overlay. Start it with
  # `--profile lion-beat` only when someone explicitly wants the scheduler.
  worker-beat:
    profiles: !override
      - lion-beat

  redis:
    ports: !override
      - "127.0.0.1:6380:6379"

  minio:
    ports: !override
      - "127.0.0.1:9010:9000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
    ports: !override
      - "127.0.0.1:8870:3000"
    volumes: !reset []
    # Production standalone server from apps/web/Dockerfile (not the Next.js dev server).
    command: ["node", "server.js"]
    environment:
      NEXTAUTH_URL: ${STAGECOACH_PUBLIC_URL:-http://127.0.0.1:8870}
      STAGECOACH_PUBLIC_URL: ${STAGECOACH_PUBLIC_URL:-http://127.0.0.1:8870}
      NODE_ENV: production

  mailpit:
    ports: !reset []
