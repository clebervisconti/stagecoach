version: "1.0.0"
created: "2026-10-09"
phase: "0"

# Scoring scale configuration
scale:
  levels: [20, 40, 60, 80, 100]
  level_names:
    "1": "Ineffective or missing"
    "2": "Needs practice"
    "3": "Effective"
    "4": "Strong"
    "5": "Exemplary"
  llm_level_to_score: "20*L-10"  # L=1 → 10, L=3 → 50, L=3.5 → 60, L=5 → 90

# Confidence thresholds and inclusion rules
confidence:
  include_full: 0.6          # q=1 if c >= 0.6
  include_partial_from: 0.4  # q=(c-0.4)/0.2 if 0.4 <= c < 0.6
  include_none_below: 0.4    # q=0 if c < 0.4
  category_min_for_overall: 0.5  # Categories with C < 0.5 excluded from overall
  labels:
    high: 0.75
    medium: 0.5

# Overall score configuration
overall:
  partial_if_coverage_below: 0.6
  display_band_factor: 10  # ± round((1 - OverallConfidence) * 10)

# Context types
contexts:
  - keynote
  - breakout
  - exec_briefing
  - sales_pitch
  - virtual_meeting
  - class_academic

# Pillars (for radar chart)
pillars:
  message:
    - core_message
    - structure
    - opening_close
    - clarity
  story_impact:
    - storytelling
    - audience_adaptation
    - impact
  visuals:
    - visual_aids
  voice:
    - pace_pausing
    - vocal_variety
    - fluency
  body:
    - gestures_body
    - eye_contact
    - facial_affect
  presence_time:
    - energy_presence
    - time_management
    - qa

# Category weights per context (each column sums to 100)
# From §4.5 of SPEC
