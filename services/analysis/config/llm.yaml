# LLM Configuration
# ADR-060: local OpenAI-compatible (LM Studio on TIGER, Qwen) is the default.
# Base URL for local comes from LOCAL_LLM_BASE_URL at runtime.
# Keys are never stored here — only env / secret manager. XAI_API_KEY is optional.

default_provider: local

providers:
  xai:
    name: xAI
    base_url: https://api.x.ai/v1
    models:
      grok-beta:
        display_name: Grok Beta
        supports_structured_output: true
        max_tokens: 131072
        price_per_input_token: 0.000005
        price_per_output_token: 0.000015
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]
      grok-2-1212:
        display_name: Grok 2 (December 2024)
        supports_structured_output: true
        max_tokens: 131072
        price_per_input_token: 0.000002
        price_per_output_token: 0.000010
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]

  local:
    name: Local OpenAI-compatible
    base_url: http://127.0.0.1:1234/v1
    models:
      qwen/qwen3.8-27b:
        display_name: Qwen 3.8 27B (LM Studio)
        supports_structured_output: true
        max_tokens: 32768
        price_per_input_token: 0
        price_per_output_token: 0
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]
      gemma-3-12b:
        display_name: Gemma (LM Studio)
        supports_structured_output: true
        max_tokens: 8192
        price_per_input_token: 0
        price_per_output_token: 0
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]

  openai:
    name: OpenAI
    base_url: https://api.openai.com/v1
    models:
      gpt-4o-mini:
        display_name: GPT-4o mini
        supports_structured_output: true
        max_tokens: 128000
        price_per_input_token: 0.00000015
        price_per_output_token: 0.0000006
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]

  anthropic:
    name: Anthropic Claude
    base_url: https://api.anthropic.com
    models:
      claude-sonnet-4-5:
        display_name: Claude Sonnet
        supports_structured_output: true
        max_tokens: 200000
        price_per_input_token: 0.000003
        price_per_output_token: 0.000015
        temperature_default: 0.4
        temperature_range: [0.0, 1.0]

  gemini:
    name: Google Gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    models:
      gemini-2.0-flash:
        display_name: Gemini 2.0 Flash
        supports_structured_output: true
        max_tokens: 1048576
        price_per_input_token: 0.0000001
        price_per_output_token: 0.0000004
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]

  custom:
    name: Custom OpenAI-compatible
    base_url: ""
    models:
      default:
        display_name: Custom model
        supports_structured_output: true
        max_tokens: 8192
        price_per_input_token: 0
        price_per_output_token: 0
        temperature_default: 0.4
        temperature_range: [0.0, 2.0]

model_assignments:
  default: qwen/qwen3.8-27b
  slides_v1: qwen/qwen3.8-27b

cost_ceiling_per_analysis: 0.50

timeout:
  default: 60
  long_form: 120

retry:
  max_attempts: 3
  backoff_factor: 2

cassettes:
  enabled: true
  directory: tests/fixtures/llm_cassettes
  record_mode: once
  match_on:
    - method
    - uri
    - body

logging:
  log_prompts: false
  log_responses: false
  log_usage: true
  log_costs: true
